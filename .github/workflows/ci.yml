name: CI

on:
  pull_request:
  push:
    branches: [main, v2-real-data]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install (CPU torch first, so requirements.txt does not pull the CUDA build)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .
      - run: pytest -q
      - run: python scripts/readme_tables.py --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t deforest .
      - name: Start (no Earth Engine credentials; /health reports earth_engine=false)
        run: docker run -d --name deforest -p 7860:7860 deforest
      - name: Wait for /health and check it
        run: |
          for i in $(seq 1 60); do
            if body=$(curl -fsS http://localhost:7860/health 2>/dev/null); then
              echo "$body"
              echo "$body" | python3 -c 'import json, sys; h = json.load(sys.stdin); assert h["status"] == "ok", h'
              curl -fsS -o /dev/null http://localhost:7860/
              exit 0
            fi
            sleep 2
          done
          echo "no healthy response within 120 s" >&2
          exit 1
      - name: Container logs
        if: always()
        run: docker logs deforest
