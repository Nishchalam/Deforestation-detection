# Study area and data definition. Every script reads this; the resolved copy is
# written next to each output so every number traces back to a config.
name: ariquemes

aoi:
  bbox: [-63.0, -10.5, -62.8, -10.3]   # lon_min, lat_min, lon_max, lat_max (EPSG:4326)
  crs: EPSG:32720                      # UTM 20S, native Sentinel-2 projection here
  scale: 10                            # metres; grid snapped to multiples of this

years: [2018, 2022]

sentinel2:
  # L1C top-of-atmosphere for BOTH years: GEE's L2A has only 6 dates in Jun-Sep 2018
  # here (vs 24 for L1C), so L1C keeps processing and seasonal sampling identical.
  collection: COPERNICUS/S2_HARMONIZED
  season: ["06-01", "10-01"]           # [start, end) month-day: June-September dry season
  bands: [B2, B3, B4, B8, B11, B12]
  cloud_mask: s2cloudless              # s2cloudless (L1C) | scl (L2A only)
  s2cloudless:                         # https://developers.google.com/earth-engine/tutorials/community/sentinel-2-s2cloudless
    collection: COPERNICUS/S2_CLOUD_PROBABILITY
    cloud_prob_threshold: 50           # % probability above which a pixel is cloud
    nir_dark_threshold: 0.15           # B8 reflectance below which a pixel can be shadow
    cloud_proj_dist_km: 1              # max shadow projection distance from cloud
    buffer_m: 50                       # dilation of the cloud+shadow mask
    mask_cirrus_qa60: false            # QA60 is empty for 2022 L1C, so using it would mask the years unequally
  scl_mask: [0, 1, 3, 8, 9, 10]        # used only when cloud_mask = scl

hansen:
  asset: auto                          # newest UMD/hansen/global_forest_change_* in the catalog

labels:
  treecover_threshold: 30              # % canopy in 2000 to count as forest

download:
  tile_px: 1024                        # request tile edge; keeps each request under the 32 MB cap

paths:
  raw: data/raw/ariquemes
