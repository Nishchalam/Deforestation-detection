[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deforest"
version = "2.0.0"
description = "Per-pixel forest mapping and forest-loss detection from Sentinel-2, labelled with Hansen GFC"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
